[package]
name = "jarvis-core"
version = "0.1.0"
edition = "2021"
default-run = "jarvis"

[lib]
name = "jarvis_core"
path = "src/lib.rs"

[[bin]]
name = "jarvis"
path = "src/main.rs"

[[bin]]
name = "jarvis-desktop"
path = "src/bin/jarvis_desktop.rs"

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.10"
serde_json = "1.0"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
crossterm = "0.28"
eframe = { version = "0.31", features = ["wayland", "default_fonts"] }
rfd = "0.15"
pollster = "0.4"
libc = "0.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
pdf-extract = "0.12.0"
